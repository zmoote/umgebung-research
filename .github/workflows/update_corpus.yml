name: Update Research Corpus

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to trigger it manually anytime from GitHub Actions tab

permissions:
  contents: write # Grants permission to commit the updated JSON file back to the repo

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run corpus builder script
        run: |
          python scripts/umgebung_corpus_builder.py

      - name: Commit and push updated corpus data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update research corpus JSON [skip ci]"
          file_pattern: 'data/umgebung_master_corpus.json'
          branch: master